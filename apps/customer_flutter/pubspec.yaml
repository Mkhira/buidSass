name: customer_flutter
description: "Dental Commerce Platform — customer app (spec 014)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — ADR-002
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Event transformers (restartable/droppable) — prevents handler races
  # on blocs that emit overlapping state fields from concurrent events.
  bloc_concurrency: ^0.2.5

  # Routing — research §R2
  go_router: ^14.6.2

  # Bloc event transformers (debounce + switchMap on QueryChanged)
  stream_transform: ^2.1.0

  # HTTP client — research §R3
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Localization + i18n — research §R4
  # Range covers Flutter 3.24 (intl 0.19.0) → 3.41+ (intl 0.20.2) per CI matrix.
  intl: ">=0.19.0 <0.21.0"
  hijri: ^3.0.0

  # Secure storage — research §R5
  flutter_secure_storage: ^9.2.2

  # Lightweight prefs for non-sensitive client state (Phase 3 recent
  # searches per spec.md BR-3).
  shared_preferences: ^2.3.2

  # Barcode scanning for Phase 3 lookup (S-3.4).
  mobile_scanner: ^5.2.3

  # Camera permission flow for lookup scan (Phase 3 plan §Camera
  # permission). Camera-only — does not pull additional permission
  # handlers at build time.
  permission_handler: ^11.3.1

  # External link launching for Phase 5 tracking-URL CTA (Phase 5
  # plan §Risk 4: always external, never in-app WebView).
  url_launcher: ^6.3.1

  # Image caching
  cached_network_image: ^3.4.1

  # Phase 6 — return wizard photo upload + invoice PDF download.
  # `image_picker` pulls the camera/gallery picker; `image` downscales
  # files > 10 MB to ≤ 2 MB before upload (plan §Risk 2). `crypto` hashes
  # the byte buffer for checksum-based dedupe (data-model.md). `uuid`
  # generates per-tile clientPhotoKey + per-wizard idempotency keys.
  # `path_provider` resolves the temp cache dir; `share_plus` opens the
  # share-sheet; `open_filex` launches the system PDF viewer.
  image_picker: ^1.1.2
  image: ^4.3.0
  crypto: ^3.0.3
  uuid: ^4.5.1
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  open_filex: ^4.5.0

  # Platform adapters — research §R7 + §R8
  sms_autofill: ^2.4.0
  app_links: ^6.3.2

  # Diagnostics
  package_info_plus: ^8.1.1
  device_info_plus: ^11.2.0

  # DI composition root
  get_it: ^7.7.0

  # UI / icon utilities
  cupertino_icons: ^1.0.8

  # In-repo design tokens + base components
  design_system:
    path: ../../packages/design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Bloc testing — research §R6
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Golden tests — research §R6
  golden_toolkit: ^0.15.0

  # Custom lint scripts (tool/lint/no_hardcoded_strings.dart)
  # Range covers Flutter 3.24 (analyzer 6) → 3.41+ (analyzer 9/10) per CI matrix.
  analyzer: ">=6.4.1 <11.0.0"

flutter:
  uses-material-design: true

  # AR-RTL fonts: rely on system fonts. If Cairo / Tajawal are needed
  # they land as font assets in a follow-up.

  generate: true # enables flutter_localizations + .arb generation
